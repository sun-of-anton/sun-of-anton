<head>

<title>Anthony Hable · The Matrix</title>
<meta name="description" content="Anthony Hable — AI Solutions Architect & Software Engineer. Something in here isn't like the rest.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{--g:#39ff7a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",Courier,monospace;color:var(--g)}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair}
  #hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.08em;pointer-events:none;text-align:center;width:calc(100% - 32px);opacity:0;transition:opacity 1.2s;text-shadow:0 0 6px #000,0 0 2px #000}
  #term{position:fixed;left:50%;bottom:16px;transform:translate(-50%,24px);width:min(760px,calc(100% - 32px));max-height:52vh;display:flex;flex-direction:column;
        background:rgba(0,8,3,.9);border:1px solid #145c2a;border-radius:10px;box-shadow:0 0 30px rgba(57,255,122,.15);
        opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
  #term.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid #0f3d1c;font-size:12px;opacity:.8}
  #bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
  #out{padding:10px 14px;overflow-y:auto;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  #out a{color:#9cffb8}
  .dim{color:#5c9e72}.hi{color:#fff;text-shadow:0 0 8px var(--g)}.red{color:#ff4b4b}
  #line{display:flex;padding:0 14px 12px;font-size:14px}
  #line span{white-space:pre}
  #in{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--g)}
  #min{margin-left:auto;cursor:pointer;background:none;border:1px solid #145c2a;color:var(--g);border-radius:4px;font:inherit;font-size:11px;padding:1px 6px}
  #term.small #out,#term.small #line{display:none}

    // sharp on retina, but keep the canvas under ~6 megapixels so huge high-density screens don't choke
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    dpr = Math.min(dpr, Math.sqrt(6e6 / (innerWidth * innerHeight)));
    dpr = Math.max(1, dpr);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = W < 600 ? 26 : 34;
    cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL) + 1;
    columns = Array.from({length: cols}, () => newColumn(true));
  }
  function newColumn(scatter) {
    return {
      head: scatter ? Math.random() * rows * 1.5 - rows * .5 : -Math.random() * rows * .6,
      v: 0.18 + Math.random() * 0.22,           // rows per 60Hz frame
      len: 6 + Math.floor(Math.random() * 14),
      glyphs: Array.from({length: rows + 40}, () => rnd(GLY))
    };
  }

      if (w.letters.every(L => L.state === 'landed')) w.hold += dt;
      for (const L of w.letters) {
        if (L.state === 'fall') {
          if (L.delay > 0) { L.delay -= dt; continue; }
          const left = L.target - L.y;
          L.y += Math.max(0.12, Math.min(L.v, left * 0.12 + 0.12)) * speed * dt;   // rains down, eases into place
          if (L.y >= L.target) { L.y = L.target; L.state = 'landed'; L.flash = 14; }
        } else if (L.state === 'landed' && w.hold > 170 && (L.wait -= dt) < 0) {
          L.state = 'drop';
        } else if (L.state === 'drop') {
          L.vy += 0.012 * speed * dt; L.y += L.vy * dt;
          if (L.y > rows) L.state = 'gone';
        }
        if (L.state === 'gone') continue;
        // falling streak above each letter, fades once it lands
        if (L.state !== 'fall') L.trailA = Math.max(0, L.trailA - 0.04 * dt);
        if (L.trailA > 0) {
          x.font = `500 ${CELL - 7}px "M PLUS 1 Code", "Courier New", monospace`;
          for (let k = 1; k <= L.trail.length; k++) {
            const r = (L.state === 'fall' ? L.y : L.target) - k; if (r < 0) continue;
            if (Math.random() < .03 * dt) L.trail[k - 1] = rnd(GLY);
            x.globalAlpha = L.trailA * (1 - k / (L.trail.length + 1)) * .9;
            x.fillStyle = '#000'; x.fillRect(L.col * CELL, r * CELL, CELL, CELL);
            x.fillStyle = color; x.fillText(L.trail[k - 1], L.col * CELL + CELL / 2, r * CELL);
          }
          x.globalAlpha = 1;
          x.font = `700 ${CELL - 7}px "M PLUS 1 Code", "Courier New", monospace`;
        }
        const dropFade = L.state === 'drop' ? Math.max(0, 1 - (L.y - L.target) / 14) : 1;
        x.globalAlpha = 1;
        x.fillStyle = '#000'; x.fillRect(L.col * CELL - 2, L.y * CELL - 2, CELL + 4, CELL * 1.4);
        x.globalAlpha = Math.max(.15, dropFade);
        x.fillStyle = L.flash > 0 || L.state === 'fall' ? '#eaffef' : (L.state === 'landed' ? color : '#9cffb8');
        if (L.flash > 0) L.flash -= dt;
        const glyph = L.state === 'landed' ? L.ch : (Math.random() < .3 ? rnd(GLY) : L.ch);
        if (L.state === 'fall' && (!L.fg || Math.random() < .15 * dt)) L.fg = rnd(GLY);
        x.fillText(L.state === 'fall' ? L.fg : glyph, L.col * CELL + CELL / 2, L.y * CELL);
      }
    }
    x.globalAlpha = 1;
    x.font = `500 ${CELL - 7}px "M PLUS 1 Code", "Courier New", monospace`;

    // hints only after 5 clicks
    if (!found && hinting) {
      if (T - lastHint > 6) {
        lastHint = T;
        dropHint(red && Math.random() < .5 ? Math.min(cols - 1, red.col + (Math.random() < .5 ? -2 : 2)) : Math.floor(Math.random() * cols), rnd(HINTS));
      }
      if (clicks >= 15) say('psst… stuck? press <b>~</b>');
      else if (clicks >= 10) say('catch the <span style="color:#ff3b3b">red</span> one.');
      else say('something in here isn\'t like the rest.');
    }
    requestAnimationFrame(frame);
  }
  Promise.race([document.fonts.load('500 20px "M PLUS 1 Code"', 'アZ'), new Promise(r => setTimeout(r, 1500))]).then(frame);

  c.addEventListener('pointerdown', e => {
    if (!found && red) {
      const p = redXY(), reach = e.pointerType === 'touch' ? 48 : 38;
      // forgiving: the head or the few cells just above it
      if (Math.abs(e.clientX - p.x) < reach && e.clientY > p.y - CELL * 3 - reach && e.clientY < p.y + reach) return wake(p.x, p.y);
    }
    if (!found) { clicks++; if (clicks === 5) lastHint = 0; }
    spawnWord(e.clientX, e.clientY);
  });
  addEventListener('keydown', e => { if (!found && (e.key === '~' || e.key === '`')) { e.preventDefault(); wake(W / 2, H / 3); } });

  // ---------------- terminal ----------------
  const out = document.getElementById('out'), inp = document.getElementById('in'), term = document.getElementById('term');
  const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const print = (html, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; return d; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let busy = false, skip = false;
  const wait = ms => skip ? Promise.resolve() : sleep(ms);
  async function type(text, cls, ms = 45) {
    const d = print('', cls);
    for (const ch of text) { d.textContent += ch; out.scrollTop = out.scrollHeight; if (!skip) await sleep(ms); }
  }
  // A line of dialogue: speaker in dim caps, the line typed out in bright text.
  async function talk(who, line, cls = 'hi') {
    const d = print(`<span class="dim">${who}:</span> <span class="${cls}"></span>`);
    const t = d.lastChild;
    for (const ch of line) { t.textContent += ch; out.scrollTop = out.scrollHeight; if (!skip) await sleep(28); }
    await wait(350);
  }
  // Scene direction: dim, quick.
  const narrate = async text => { await type(text, 'dim', 18); await wait(250); };
  // A construct-style loading bar.
  async function load(label) {
    const d = print(`<span class="dim">${label}</span> `);
    const bar = document.createElement('span'); d.appendChild(bar);
    for (let i = 1; i <= 16; i++) { bar.textContent = '[' + '█'.repeat(i) + ' '.repeat(16 - i) + '] ' + Math.round(i / 16 * 100) + '%'; if (!skip) await sleep(22); }
  }

  async function wake(gx, gy) {
    if (found) return; found = true; busy = true;
    say(''); hints = []; pulses = []; red = null;
    for (let i = 0; i < 4; i++) setTimeout(() => pulses.push({x: gx, y: gy, r: 4}), i * 180);
    spawnWord(W / 2, H * 0.22, 'WAKE UP');
    term.classList.add('open'); term.setAttribute('aria-hidden', 'false');
    await sleep(600);
    await type('Wake up…', 'hi', 90); await sleep(900);
    await type('The Matrix has you…', 'hi', 70); await sleep(900);
    await type('Follow the white rabbit.', 'hi', 60); await sleep(700);
    await type('Knock, knock.', 'hi', 80); await sleep(500);
    print(`<span class="dim">you caught the red one. type </span><span class="hi">help</span><span class="dim"> to look around.</span>`);
    busy = false;
    if (matchMedia('(pointer:fine)').matches) inp.focus();
  }

  const COLORS = {green:'#39ff7a', red:'#ff4b4b', cyan:'#38e8ff', amber:'#ffb000', white:'#e8ffe8'};
  const setColor = n => { color = COLORS[n]; document.documentElement.style.setProperty('--g', color); };

  const CMDS = {
    help: async () => {
      await narrate('☎  ring… ring…');
      await talk('TANK', 'Operator. So what do you need? Besides a miracle.');
      print(`<span class="dim">programs on the construct:</span>
  <span class="hi">who am i</span>        who is Anthony?
  <span class="hi">where am i</span>      where is Anthony?
  <span class="hi">career</span>          the path he walked
  <span class="hi">skills</span>          load the training programs
  <span class="hi">certs</span>           the sparring program
  <span class="hi">find me</span>         get patched through
  <span class="hi">speed</span> &lt;0.2–4&gt;     bend time
  <span class="hi">clear</span>           déjà vu
  <span class="hi">exit</span>            get out`);
      await wait(300);
      await talk('TANK', "Some programs aren't on the list. You'll have to find those yourself.");
      await talk('MORPHEUS', "Or just talk to me. I'm listening.");
      return null;
    },

    whoareyou: async () => {
      await narrate("the Oracle's kitchen. something smells like cookies.");
      await talk('ORACLE', 'See that sign above the door? "Temet nosce." Know thyself.');
      await talk('ORACLE', "I'll save you the trouble.");
      print(`
  <span class="hi">Anthony Hable</span> — AI Solutions Architect · Software Engineer
  AWS solutions architect building agentic AI systems and cloud
  infrastructure for locked-down federal environments.
  Hampton Roads, VA · coding since 2015 · U.S. Navy veteran
`);
      await talk('ORACLE', "Here, take a cookie. You'll feel right as rain.");
      return null;
    },

    whereareyou: async () => {
      await narrate('the Nebuchadnezzar. Tank runs a trace on the signal.');
      await talk('TANK', 'Got him. Hampton Roads, Virginia. Norfolk Naval Shipyard.');
      await talk('MORPHEUS', "And what he's fighting for:");
      print(`
  ▸ designing agentic AI for software dev intelligence & autonomous agile PM
  ▸ architecting AWS infrastructure for restricted environments
  ▸ applying AI-assisted engineering to ship faster
`);
      await talk('MORPHEUS', 'The mission is real. The machines are just tools.');
      return null;
    },

    career: async () => {
      await talk('MORPHEUS', "There's a difference between knowing the path and walking the path.");
      await narrate('he walked a lot of them.');
      const steps = [
        ['2004', 'Navy', 'peaked early?'],
        ['2011', 'Veterans Health Admin', 'discovered SharePoint'],
        ['2013', 'AECOM', 'roads, drains, fire sprinklers'],
        ['2015', 'L3 / TECOMSYS', 'satellites & antennas'],
        ['2018', 'Boeing', "automated everyone's job"],
        ['2020', 'Northrop Grumman', 'first "Software Engineer" title'],
        ['2023', 'Velocity Consulting', 'AI-generated voiceovers'],
        ['2024', 'HII', 'air-gapped on purpose'],
        ['2025', 'CACI', 'GovCloud IL5'],
      ];
      for (const [y, org, note] of steps) { print(`${y}  ${(org + ' ').padEnd(29, '.')} ${esc(note)}`); await wait(140); }
      print(`2026  ${'Norfolk Naval Shipyard '.padEnd(29, '.')} <span class="hi">found the groove ◀</span>`);
      await wait(400);

    },

    skills: async () => {
      await narrate('the construct. Tank pulls up the training disks.');
      await talk('TANK', "Okay. Let's load some programs.");
      const progs = [
        ['cloud.prg   ', 'AWS · Lambda · Step Functions · Glue · S3 · IAM · KMS · GovCloud'],
        ['code.prg    ', 'Python · SQL/PostgreSQL · Bash · MATLAB · LabVIEW'],
        ['delivery.prg', 'IaC · Azure DevOps · Power Automate · Agile/Scrum'],

      await wait(400);

    certs: async () => {

        'AWS Certified Solutions Architect – Associate   (2026)',

      ];
      for (const c of list) { print(`  <span class="hi">✔</span> ${c}`); await wait(260); }
      spawnWord(W / 2, H * 0.22, 'CERTIFIED');

    },

    findme: async () => {

      await type('the operator is patching you through from the Nebuchadnezzar.', 'dim', 25); await wait(500);
      await type('"I can only show you the door. You\'re the one that has to walk through it."', 'hi', 30); await wait(400);
      print(`
  the door  →  <a href="https://www.linkedin.com/in/ashable/" target="_blank" rel="noopener">linkedin.com/in/ashable</a>
  the code  →  <a href="https://github.com/sun-of-anton" target="_blank" rel="noopener">github.com/sun-of-anton</a>
  the line  →  ${(() => { const m = ['elbah.ynohtna.ot', 'moc.liamg'].map(r => [...r].reverse().join('')).join('@'); return `<a href="mailto:${m}?subject=I%20took%20the%20red%20pill">${m}</a>`; })()}
<span class="dim">signal lost. hang up the phone.</span>`);
      spawnWord(W / 2, H * 0.22, 'COME FIND ME');
      return null;
    },
    // old names still work, just not advertised
    whoami: () => CMDS.whoareyou(), whereami: () => CMDS.whereareyou(), now: () => CMDS.whereareyou(),
    contact: () => CMDS.findme(), contacts: () => CMDS.findme(),
    whoisanthony: () => CMDS.whoareyou(), whoishe: () => CMDS.whoareyou(),
    whereishe: () => CMDS.whereareyou(), whereisanthony: () => CMDS.whereareyou(),


    speed: async a => {
      const v = parseFloat(a[0]);
      if (!(v >= .2 && v <= 4)) { await talk('MORPHEUS', 'Time bends between 0.2 and 4. No further.'); return null; }

      if (v < 1) await talk('MORPHEUS', "Time slows. You're starting to see it. Bullets, everything.");
      else if (v > 1) await talk('MORPHEUS', "You think that's air you're breathing now?");
      else await narrate('time returns to normal.');

    clear: async () => {

      await talk('TRINITY', 'Déjà vu is usually a glitch in the Matrix. It happens when they change something.');

    // hidden

    areweinthematrix: async () => {

    sudo: async () => { await talk('AGENT SMITH', 'Mr. Anderson… you have no authority here.', 'red'); return null; },

    hello: async () => { await talk('AGENT SMITH', 'Hello… Mr. Anderson.', 'red'); await narrate('(Hello, World! 👋)'); return null; },
    follow: async a => {

      spawnWord(W / 2, H * .22, 'KNOCK KNOCK');

    coffee: async () => {

  // ---- Morpheus listens: anything that isn't a command gets an answer ----
  const INTENTS = [
    {re: /\b(are|r) (we|us|you|i) (all )?(slaves?|prisoners?|free)\b|\bslaves?\b/, run: async () => CMDS.areweslaves()},
    {re: /\b(are|r) (we|you|i) (all )?(in|inside) (the )?matrix\b|\bin the matrix\b/, run: async () => CMDS.areweinthematrix()},
    {re: /\b(hir(e|ing)|job|role|position|recruit|opportunit|interview|resume|cv|freelance|contract|available|work with|team)\b/,
     run: async () => { await talk('MORPHEUS', "You're not here by accident. You're looking for him."); await talk('MORPHEUS', "I'll patch you through."); return CMDS.findme(); }},
    {re: /\b(aws|cloud|lambda|python|sql|postgres|stack|tech|skills?|code|coding|program(ming)?|language|devops|terraform|iac)\b/,
     run: async () => { await talk('MORPHEUS', "You want to know what he can do. Tank, load the programs."); return CMDS.skills(); }},
    {re: /\b(certs?|certified|certifications?|security\+?|comptia|scrum)\b/, run: async () => { await talk('MORPHEUS', "Words are easy. Let him show you."); return CMDS.certs(); }},
    {re: /\b(career|experience|history|background|resume|navy|boeing|northrop|caci|hii|journey|path)\b/,
     run: async () => CMDS.career()},
    {re: /\b(where|located|location|based|his work|what does he do|agentic|agents?|ai|llm|claude|gpt|machine learning|working on|currently|right now|project|mission|building)\b/,
     run: async () => { await talk('MORPHEUS', "The machines are coming. He's teaching them to work for us."); return CMDS.whereareyou(); }},
    {re: /\b(who (is|are)|about|anthony|yourself|bio|tell me)\b/, run: async () => { await talk('MORPHEUS', "You want to know who he is. Only the Oracle can tell you that."); return CMDS.whoareyou(); }},
    {re: /\b(real|matrix|dream|simulation)\b/, run: async () => { await talk('MORPHEUS', 'What is real? How do you define "real"?'); await talk('MORPHEUS', "If you're talking about what you can feel, what you can smell, taste and see… then real is simply electrical signals interpreted by your brain."); return null; }},
    {re: /\b(neo|the one|chosen)\b/, run: async () => { await talk('MORPHEUS', "I've been looking for the One a long time."); await talk('MORPHEUS', "Maybe it's you. Maybe it's him. Ask him: who are you?"); return null; }},
    {re: /\b(pill|choice|choose)\b/, run: async () => CMDS.choice()},
    {re: /\b(thanks?|thank you|thx|cool|awesome|nice|dope|sick|love (it|this))\b/, run: async () => { await talk('MORPHEUS', "Don't thank me. Walk through the door."); print('<span class="dim">(type </span><span class="hi">find me</span><span class="dim">)</span>'); return null; }},
    {re: /\b(hi|hello|hey|yo|sup|greetings|morpheus)\b/, run: async () => { await talk('MORPHEUS', "At last. I've been waiting for you."); await talk('MORPHEUS', 'Ask me anything. Or type help.'); return null; }},
    {re: /\b(help|how|what can|commands?|lost|stuck|confused)\b/, run: async () => CMDS.help()},
    {re: /\b(cls|clean|wipe)\b/, run: async () => CMDS.clear()},
    {re: /\b(bye|goodbye|quit|logout|log off)\b/, run: async () => CMDS.exit()},
  ];
  const FALLBACK = [
    ["I can't answer that. But I can show you the door.", 'find me'],
    ["You're thinking about it too hard. Free your mind.", 'help'],
    ["Not everything is a program. Some things you have to ask him yourself.", 'find me'],
    ["I don't know that one. But he might. Ask him yourself.", 'find me'],
  ];
  async function listen(raw) {
    const t = raw.toLowerCase();
    const hit = INTENTS.find(i => i.re.test(t));
    if (hit) return hit.run();
    const [line, next] = rnd(FALLBACK);
    await talk('MORPHEUS', line);
    return `<span class="dim">(try </span><span class="hi">${next}</span><span class="dim">)</span>`;
  }

  // ---- the rain listens too: each keystroke falls, each finished word lands ----
  let typedWord = '', slot = 0;
  // typed words take turns on six rows in the upper screen so they don't stack on each other
  const landTyped = w => spawnWord(W * (0.15 + Math.random() * 0.7), H * (0.1 + (slot++ % 6) * 0.065), w.slice(0, 18));
  inp.addEventListener('input', e => {
    const ch = e.data;
    if (!ch) return;
    if (/\s/.test(ch)) {
      if (typedWord.length >= 2 && words.length < 5) landTyped(typedWord);
      typedWord = '';
    } else {
      typedWord += ch;
      dropHint(Math.floor(Math.random() * cols), ch.toUpperCase(), 0.9);
    }
  });

  const hist = []; let hi = 0;
  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      if (busy) { skip = true; if (fx) { fx.done(); fx = null; } return; }   // Enter mid-scene skips to the end
      const raw = inp.value.trim(); inp.value = '';
      if (!raw) return;
      hist.push(raw); hi = hist.length;
      print(`<span class="dim">anthony@matrix:~$</span> ${esc(raw)}`);
      const [cmd, ...args] = raw.split(/\s+/);
      const phrase = raw.toLowerCase().replace(/[^a-z]/g, '');
      const f = CMDS[cmd.toLowerCase()] || (CMDS[phrase] ? () => CMDS[phrase]([]) : null);   // 'speed 2' keeps its number; 'who are you?' still matches
      busy = true; skip = false;
      if (typedWord.length >= 2 && words.length < 5) landTyped(typedWord);
      typedWord = '';
      try { const r = f ? await f(args) : await listen(raw); if (r) print(r); }
      finally { busy = false; skip = false; }
    } else if (e.key === 'ArrowUp') { if (hi > 0) inp.value = hist[--hi]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { inp.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ''); }
  });
  document.getElementById('min').onclick = () => term.classList.toggle('small');
  term.addEventListener('pointerdown', e => { if (e.target.tagName !== 'A' && e.target.id !== 'min') setTimeout(() => inp.focus(), 0); });
})();
