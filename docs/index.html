<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthony Hable · The Matrix</title>
<meta name="description" content="Anthony Hable — AI Solutions Architect & Software Engineer. Something in here isn't like the rest.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--g:#39ff7a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",Courier,monospace;color:var(--g)}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair}
  #hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.08em;pointer-events:none;text-align:center;width:calc(100% - 32px);opacity:0;transition:opacity 1.2s;text-shadow:0 0 6px #000,0 0 2px #000}
  #term{position:fixed;left:50%;bottom:16px;transform:translate(-50%,24px);width:min(760px,calc(100% - 32px));max-height:52vh;display:flex;flex-direction:column;
        background:rgba(0,8,3,.9);border:1px solid #145c2a;border-radius:10px;box-shadow:0 0 30px rgba(57,255,122,.15);
        opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
  #term.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid #0f3d1c;font-size:12px;opacity:.8}
  #bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
  #out{padding:10px 14px;overflow-y:auto;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  #out a{color:#9cffb8}
  .dim{color:#5c9e72}.hi{color:#fff;text-shadow:0 0 8px var(--g)}.red{color:#ff4b4b}
  #line{display:flex;padding:0 14px 12px;font-size:14px}
  #line span{white-space:pre}
  #in{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--g)}
  #min{margin-left:auto;cursor:pointer;background:none;border:1px solid #145c2a;color:var(--g);border-radius:4px;font:inherit;font-size:11px;padding:1px 6px}
  #term.small #out,#term.small #line{display:none}
  #snd{position:fixed;top:12px;right:12px;z-index:2;cursor:pointer;background:rgba(0,8,3,.75);border:1px solid #145c2a;color:var(--g);border-radius:4px;font:inherit;font-size:12px;padding:3px 8px;opacity:.7}
  #pill-nav{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:calc(100% - 24px)}
  #pill-nav[hidden]{display:none}
  #pill-prompt{flex-basis:100%;margin:0;text-align:center;font-size:13px;color:var(--g);text-shadow:0 0 6px #000,0 0 12px #000}
  #pill-nav a{background:#080c0a;border:1px solid currentColor;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
  #pill-nav a:hover{text-decoration:underline}
  #pill-nav a:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #term.pill-scene{pointer-events:none}
  #pill-red{color:#ff7676}
  #pill-blue{color:#79b7ff}
  #snd:hover,#snd:focus-visible{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<nav hidden id="pill-nav" aria-label="Choose your pill">
  <p id="pill-prompt">Choose your pill. Click or tap one.</p>
  <a id="pill-red" href="./resume.html?enter=1">Red pill · View résumé</a>
  <a id="pill-blue" href="https://github.com/sun-of-anton">Blue pill · Back to GitHub</a>
</nav>
<button id="snd" aria-pressed="false" title="music">♪ off</button>
<div id="term" aria-hidden="true">
  <div id="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>&nbsp; anthony@matrix: ~ <button id="min" title="minimize">_</button></div>
  <div id="out"></div>
  <div id="line"><span>anthony@matrix:~$ </span><input id="in" autocomplete="off" spellcheck="false" aria-label="terminal input"></div>
</div>
<script>
(() => {
  const GLY = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z=*+<>:";
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const c = document.getElementById('c'), x = c.getContext('2d');
  const hintEl = document.getElementById('hint');
  let W, H, CELL, cols, rows, columns = [], speed = 1, color = '#39ff7a', words = [], hints = [];
  let lastT = 0, found = false, lastHint = 0, pulses = [], clicks = 0, red = null, nextRed = performance.now() / 1000 + 4;

  // ---------- crisp rain: device-pixel canvas, per-cell glyphs, explicit trails ----------
  function size() {
    // sharp on retina, but keep the canvas under ~6 megapixels so huge high-density screens don't choke
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    dpr = Math.min(dpr, Math.sqrt(6e6 / (innerWidth * innerHeight)));
    dpr = Math.max(1, dpr);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = W < 600 ? 26 : 34;
    cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL) + 1;
    columns = Array.from({length: cols}, () => newColumn(true));
  }
  function newColumn(scatter) {
    return {
      head: scatter ? Math.random() * rows * 1.5 - rows * .5 : -Math.random() * rows * .6,
      v: 0.18 + Math.random() * 0.22,           // rows per 60Hz frame
      len: 6 + Math.floor(Math.random() * 14),
      glyphs: Array.from({length: rows + 40}, () => rnd(GLY))
    };
  }
  addEventListener('resize', size); size();

  const WORDS = ["AWS","AGENTIC AI","PYTHON","GOVCLOUD","LAMBDA","SHIP IT","HELLO WORLD","ARCHITECT","AUTOMATE","POSTGRES","SECURITY+","FOUND THE GROOVE"];
  const HINTS = ["FOLLOW THE WHITE RABBIT","LOOK CLOSER","FOLLOW THE RED","DEJA VU","KNOCK KNOCK","SOMETHING IS WRONG","CATCH THE RED ONE"];

  // Clicked words: letters drop out of the rain into place, hold, then fall out the bottom.
  function spawnWord(px, py, text) {
    text = (text || rnd(WORDS)).toUpperCase();
    const startCol = Math.max(0, Math.min(cols - text.length, Math.round(px / CELL - text.length / 2)));
    const row = Math.max(1, Math.round(py / CELL));
    words.push({t: 0, hold: 0, letters: [...text].map((ch, i) => ({
      ch, col: startCol + i, y: -1 - Math.random() * 6, target: row,          // starts at the top of the screen
      state: 'fall', flash: 0, vy: 0, wait: i * 4 + Math.random() * 10,
      delay: Math.random() * 25, v: 0.5 + Math.random() * 0.25, trailA: 1,
      trail: Array.from({length: 8}, () => rnd(GLY))
    }))});
  }
  // A hint is a bright vertical word riding down a column.
  function dropHint(col, text, v = 0.3) { hints.push({col, row: -text.length, text, v: v * speed}); }

  const now = () => performance.now() / 1000;
  // The key: one red glyph trail that falls now and then. Click it to wake up.
  const redXY = () => ({x: red.col * CELL + CELL / 2, y: red.head * CELL + CELL / 2});
  const say = s => { hintEl.innerHTML = s; hintEl.style.opacity = s ? .85 : 0; };

  // ---------- the score: synthesized live with Web Audio, no audio files ----------
  // A drone that follows the bass, a heartbeat kick, ticking like falling code, and minor-chord arpeggios into a
  // long echo. Browsers only allow sound after a click or key press, so it starts on the visitor's first one.
  const sound = (() => {
    const btn = document.getElementById('snd');
    let ac = null, master, bus, noise, drone = [], muted = false, step = 0, next = 0, arp = [];
    try { muted = localStorage.getItem('matrix-muted') === '1'; } catch {}
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const BPM = 96, STEP = 60 / BPM / 4;
    // Em · C · Am · Bm: bass roots and the chord tones the arpeggio picks from
    const ROOTS = [40, 36, 33, 35], CHORDS = [[64, 67, 71], [60, 64, 67], [57, 60, 64], [59, 62, 66]];
    const label = () => { const on = !!ac && !muted && ac.state === 'running'; btn.textContent = on ? '♪ on' : '♪ off'; btn.setAttribute('aria-pressed', String(on)); };
    function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
    function voice(type, f, t, peak, a, d, cut, to = master) {
      const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
      o.type = type; o.frequency.value = f; fl.type = 'lowpass';
      fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(Math.max(80, cut / 8), t + a + d);
      env(g, t, peak, a, d); o.connect(fl).connect(g).connect(to);
      o.start(t); o.stop(t + a + d + 0.05);
    }
    function hiss(t, peak, d, type, f0, f1) {
      const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; fl.type = type; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
      env(g, t, peak, 0.005, d); s.connect(fl).connect(g).connect(master);
      s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
    }
    function kick(t, peak) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
      env(g, t, peak, 0.004, 0.4); o.connect(g).connect(master); o.start(t); o.stop(t + 0.5);
    }
    function play(n, t) {
      const bar = Math.floor(n / 16), s = n % 16, ch = bar % 4;
      if (s === 0) {
        drone.forEach((o, i) => o.frequency.setTargetAtTime(hz(ROOTS[ch] - 12 + i * 12) * (i ? 1.004 : 1), t, 0.4));
        if (bar % 4 === 0) arp = Array.from({length: 16}, () => Math.random() < 0.55 ? Math.floor(Math.random() * 6) : -1);
      }
      if (s === 0 || s === 3) kick(t, s ? 0.3 : 0.55);                       // lub-dub
      if (s % 2 === 1 && Math.random() < 0.7) hiss(t, 0.02 + Math.random() * 0.02, 0.04, 'highpass', 6000 + Math.random() * 4000, 9000);
      if (s === 0 || s === 8 || s === 10) voice('sawtooth', hz(ROOTS[ch]), t, 0.13, 0.01, 0.35, 700);
      if (arp[s] >= 0) { const k = arp[s]; voice('sawtooth', hz(CHORDS[ch][k % 3] + (k > 2 ? 12 : 0)), t, 0.05, 0.005, 0.28, 2600, bus); }
    }
    // iPhones mute web audio when the ring/silent switch is on unless the page asks for media playback: newer Safari
    // has audioSession for that; older iOS switches over when an <audio> element plays, so loop a silent clip there
    let keepAlive = null;
    function playThroughSilentMode() {
      if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; }
      if (!/iP(hone|ad|od)/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent))) return;
      if (!keepAlive) {
        const n = 800, b = new DataView(new ArrayBuffer(44 + n)), str = (o, s) => [...s].forEach((ch, i) => b.setUint8(o + i, ch.charCodeAt(0)));
        str(0, 'RIFF'); b.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true);
        b.setUint16(22, 1, true); b.setUint32(24, 8000, true); b.setUint32(28, 8000, true); b.setUint16(32, 1, true);
        b.setUint16(34, 8, true); str(36, 'data'); b.setUint32(40, n, true);
        for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);                // 0.1 s of 8-bit silence
        keepAlive = new Audio(URL.createObjectURL(new Blob([b], {type: 'audio/wav'})));
        keepAlive.loop = true; keepAlive.setAttribute('playsinline', '');
      }
      keepAlive.play().catch(() => {});
    }
    function start() {
      playThroughSilentMode();
      ac = new (window.AudioContext || window.webkitAudioContext)();
      ac.onstatechange = label;
      master = ac.createGain(); master.gain.value = 0.0001;
      const comp = ac.createDynamicsCompressor(); master.connect(comp).connect(ac.destination);
      // everything melodic goes through a dotted-eighth echo that darkens as it repeats
      bus = ac.createGain();
      const dl = ac.createDelay(2), fb = ac.createGain(), tone = ac.createBiquadFilter();
      dl.delayTime.value = STEP * 3; fb.gain.value = 0.45; tone.type = 'lowpass'; tone.frequency.value = 1800;
      bus.connect(master); bus.connect(dl); dl.connect(tone).connect(fb).connect(dl); tone.connect(master);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      noise.getChannelData(0).forEach((_, i, a) => { a[i] = Math.random() * 2 - 1; });
      // the drone: two detuned saws an octave apart through a slowly breathing lowpass
      const dlp = ac.createBiquadFilter(), dg = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      dlp.type = 'lowpass'; dlp.frequency.value = 220; dlp.Q.value = 5; dg.gain.value = 0.12;
      lfo.frequency.value = 0.06; lg.gain.value = 140; lfo.connect(lg).connect(dlp.frequency); lfo.start();
      drone = [0, 1].map(i => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(28 + i * 12); o.connect(dlp); o.start(); return o; });
      dlp.connect(dg).connect(master);
      next = ac.currentTime + 0.1;
      setInterval(() => { if (ac.state !== 'running') return; while (next < ac.currentTime + 0.12) { play(step++, next); next += STEP; } }, 30);
      fade();
    }
    function fade() {
      if (!ac) return;
      const t = ac.currentTime;
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), t);
      if (muted) { master.gain.exponentialRampToValueAtTime(0.0001, t + 0.4); setTimeout(() => muted && ac.suspend(), 500); if (keepAlive) keepAlive.pause(); }
      else { playThroughSilentMode(); ac.resume(); master.gain.exponentialRampToValueAtTime(0.5, t + 2.5); }
      label();
    }
    // first click, tap or key anywhere starts it (unless they switched it off last visit); the button toggles.
    // Browsers differ on which events may unlock audio (iOS ignores pointerdown and counts touchend and click), so
    // listen to all of them and keep retrying until it is actually running.
    const poke = e => {
      if (muted || e.target === btn || document.hidden) return;
      if (!ac) start(); else if (ac.state !== 'running') { playThroughSilentMode(); ac.resume(); }
    };
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, poke, true));
    btn.addEventListener('click', () => {
      if (!ac) { muted = false; start(); }
      else if (!muted && ac.state !== 'running') fade();                  // it was blocked, not switched off: try again
      else { muted = !muted; fade(); }
      try { localStorage.setItem('matrix-muted', muted ? '1' : '0'); } catch {}
    });
    document.addEventListener('visibilitychange', () => { if (!ac || muted) return; document.hidden ? ac.suspend() : ac.resume(); });
    label();
    return {
      // a low boom and a falling wash of noise: for waking up and for things pressing through the rain
      hit() {
        if (!ac || muted) return;
        const t = ac.currentTime + 0.02, o = ac.createOscillator(), g = ac.createGain();
        o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.4);
        env(g, t, 0.6, 0.01, 1.6); o.connect(g).connect(master); o.start(t); o.stop(t + 1.7);
        hiss(t, 0.12, 1.8, 'lowpass', 5000, 150);
      }
    };
  })();


  // ---------- something pressing through the code ----------
  // The rain is a membrane. A depth map pushes it toward the viewer: rain bends outward over the form, and the code
  // running down the raised surface is lit by its slope, so the shape exists only as disturbed, re-lit rain.
  // Depth maps are small renders of a real mesh, baked offline:
  //   pills: generic-hand right.glb from @webxr-input-profiles/assets (Immersive Web CG, MIT), tilted palm-up and
  //          mirrored into a pair (128x128), with a capsule raised in each palm
  const PILLS_DEPTH = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA       await talk('MORPHEUS', 'You take the red pill, you stay in Wonderland,', 'red');
      setColor('red'); spawnWord(W / 2, H * .22, 'WAKE UP, NEO');
      await talk('MORPHEUS', 'and I show you how deep the rabbit hole goes.', 'red');
      location.href = document.getElementById('pill-red').href;
      return null;
    },
    bluepill: async () => {
      await talk('MORPHEUS', 'You take the blue pill, the story ends.');
      await talk('MORPHEUS', 'You wake up in your bed and believe whatever you want to believe.');
      await wait(700);
      location.href = 'https://github.com/sun-of-anton';
      return null;
    },
    spoon: async () => {
      await talk('SPOON BOY', "Do not try and bend the spoon. That's impossible.");
      await talk('SPOON BOY', 'Instead, only try to realize the truth.');
      spawnWord(W / 2, H * .22, 'THERE IS NO SPOON');
      await talk('SPOON BOY', 'There is no spoon.');
      return null;
    },
    sudo: async () => { await talk('AGENT SMITH', 'Mr. Anderson… you have no authority here.', 'red'); return null; },
    ls: async () => {
      await narrate("Tank opens the ship's files.");
      return `about.txt  career.log  certs/  secrets/  <span class="dim">(try cat)</span>`;
    },
    cat: async a => {
      const f = a[0] || '';
      if (f === 'secrets/' || f === 'secrets') {
        await talk('CYPHER', 'Ignorance is bliss.');
        return '<span class="red">permission denied: IL5 says no.</span>';
      }
      const m = {'about.txt': 'whoareyou', 'career.log': 'career', 'certs/': 'certs', 'certs': 'certs'}[f];
      if (m) return CMDS[m]();
      await talk('TANK', `Nothing on the ship called "${esc(f)}".`);
      return null;
    },
    hello: async () => { await talk('AGENT SMITH', 'Hello… Mr. Anderson.', 'red'); await narrate('(Hello, World! 👋)'); return null; },
    follow: async a => {
      if (!a.join(' ').includes('white rabbit')) { await talk('TRINITY', 'Follow what?'); return null; }
      spawnWord(W / 2, H * .22, 'KNOCK KNOCK');
      await narrate('🐇 someone knocks on your door.');
      await talk('TRINITY', "He's been looking for you. Follow the white rabbit.");
      return null;
    },
    coffee: async () => {
      await talk('ORACLE', "No coffee. But the cookies'll be done in a minute.");
      await narrate('(agentic AI cannot brew coffee yet either.)');
      return null;
    }
  };


  // ---- Morpheus listens: anything that isn't a command gets an answer ----
  const INTENTS = [
    {re: /\b(are|r) (we|us|you|i) (all )?(slaves?|prisoners?|free)\b|\bslaves?\b/, run: async () => CMDS.areweslaves()},
    {re: /\b(are|r) (we|you|i) (all )?(in|inside) (the )?matrix\b|\bin the matrix\b/, run: async () => CMDS.areweinthematrix()},
    {re: /\b(hir(e|ing)|job|role|position|recruit|opportunit|interview|resume|cv|freelance|contract|available|work with|team)\b/,
     run: async () => { await talk('MORPHEUS', "You're not here by accident. You're looking for him."); await talk('MORPHEUS', "I'll patch you through."); return CMDS.findme(); }},
    {re: /\b(aws|cloud|lambda|python|sql|postgres|stack|tech|skills?|code|coding|program(ming)?|language|devops|terraform|iac)\b/,
     run: async () => { await talk('MORPHEUS', "You want to know what he can do. Tank, load the programs."); return CMDS.skills(); }},
    {re: /\b(certs?|certified|certifications?|security\+?|comptia|scrum)\b/, run: async () => { await talk('MORPHEUS', "Words are easy. Let him show you."); return CMDS.certs(); }},
    {re: /\b(career|experience|history|background|resume|navy|boeing|northrop|caci|hii|journey|path)\b/,
     run: async () => CMDS.career()},
    {re: /\b(where|located|location|based|his work|what does he do|agentic|agents?|ai|llm|gpt|machine learning|working on|currently|right now|project|mission|building)\b/,
     run: async () => { await talk('MORPHEUS', "The machines are coming. He's teaching them to work for us."); return CMDS.whereareyou(); }},
    {re: /\b(who (is|are)|about|anthony|yourself|bio|tell me)\b/, run: async () => { await talk('MORPHEUS', "You want to know who he is. Only the Oracle can tell you that."); return CMDS.whoareyou(); }},
    {re: /\b(real|matrix|dream|simulation)\b/, run: async () => { await talk('MORPHEUS', 'What is real? How do you define "real"?'); await talk('MORPHEUS', "If you're talking about what you can feel, what you can smell, taste and see… then real is simply electrical signals interpreted by your brain."); return null; }},
    {re: /\b(neo|the one|chosen)\b/, run: async () => { await talk('MORPHEUS', "I've been looking for the One a long time."); await talk('MORPHEUS', "Maybe it's you. Maybe it's him. Ask him: who are you?"); return null; }},
    {re: /\b(pill|choice|choose)\b/, run: async () => CMDS.choice()},
    {re: /\b(thanks?|thank you|thx|cool|awesome|nice|dope|sick|love (it|this))\b/, run: async () => { await talk('MORPHEUS', "Don't thank me. Walk through the door."); print('<span class="dim">(type </span><span class="hi">find me</span><span class="dim">)</span>'); return null; }},
    {re: /\b(hi|hello|hey|yo|sup|greetings|morpheus)\b/, run: async () => { await talk('MORPHEUS', "At last. I've been waiting for you."); await talk('MORPHEUS', 'Ask me anything. Or type help.'); return null; }},
    {re: /\b(help|how|what can|commands?|lost|stuck|confused)\b/, run: async () => CMDS.help()},
    {re: /\b(cls|clean|wipe)\b/, run: async () => CMDS.clear()},
    {re: /\b(bye|goodbye|quit|logout|log off)\b/, run: async () => CMDS.exit()},
  ];
  const FALLBACK = [
    ["I can't answer that. But I can show you the door.", 'find me'],
    ["You're thinking about it too hard. Free your mind.", 'help'],
    ["Not everything is a program. Some things you have to ask him yourself.", 'find me'],
    ["I don't know that one. But he might. Ask him yourself.", 'find me'],
  ];
  async function listen(raw) {
    const t = raw.toLowerCase();
    const hit = INTENTS.find(i => i.re.test(t));
    if (hit) return hit.run();
    const [line, next] = rnd(FALLBACK);
    await talk('MORPHEUS', line);
    return `<span class="dim">(try </span><span class="hi">${next}</span><span class="dim">)</span>`;
  }

  // ---- the rain listens too: each keystroke falls, each finished word lands ----
  let typedWord = '', slot = 0;
  // typed words take turns on six rows in the upper screen so they don't stack on each other
  const landTyped = w => spawnWord(W * (0.15 + Math.random() * 0.7), H * (0.1 + (slot++ % 6) * 0.065), w.slice(0, 18));
  inp.addEventListener('input', e => {
    const ch = e.data;
    if (!ch) return;
    if (/\s/.test(ch)) {
      if (typedWord.length >= 2 && words.length < 5) landTyped(typedWord);
      typedWord = '';
    } else {
      typedWord += ch;
      dropHint(Math.floor(Math.random() * cols), ch.toUpperCase(), 0.9);
    }
  });

  const hist = []; let hi = 0;
  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      if (busy) { skip = true; if (fx) { fx.done(); fx = null; } return; }   // Enter mid-scene skips to the end
      const raw = inp.value.trim(); inp.value = '';
      if (!raw) return;
      hist.push(raw); hi = hist.length;
      print(`<span class="dim">anthony@matrix:~$</span> ${esc(raw)}`);
      const [cmd, ...args] = raw.split(/\s+/);
      const phrase = raw.toLowerCase().replace(/[^a-z]/g, '');
      const f = CMDS[cmd.toLowerCase()] || (CMDS[phrase] ? () => CMDS[phrase]([]) : null);   // 'speed 2' keeps its number; 'who are you?' still matches
      busy = true; skip = false;
      if (typedWord.length >= 2 && words.length < 5) landTyped(typedWord);
      typedWord = '';
      try { const r = f ? await f(args) : await listen(raw); if (r) print(r); }
      finally { busy = false; skip = false; }
    } else if (e.key === 'ArrowUp') { if (hi > 0) inp.value = hist[--hi]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { inp.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ''); }
  });
  document.getElementById('min').onclick = () => term.classList.toggle('small');
  term.addEventListener('pointerdown', e => { if (e.target.tagName !== 'A' && e.target.id !== 'min') setTimeout(() => inp.focus(), 0); });
})();
</script>
</body>
</html>
